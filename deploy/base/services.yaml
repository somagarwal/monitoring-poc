---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 4000, targetPort: 4000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: gateway
          image: little-market-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICE_NAME, value: gateway}
            - {name: PORT, value: '4000'}
            - name: INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: market-secrets, key: INTERNAL_TOKEN}}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: market-secrets, key: DATABASE_PASSWORD}}
            - {name: DATABASE_URL, value: 'postgres://market_gateway:$(DATABASE_PASSWORD)@postgres:5432/market'}
          ports: [{containerPort: 4000}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/live, port: 4000}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: 4000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 4000}
            periodSeconds: 10
---
